<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);">Grouped bar chart of total word counts across nine seeded responses per mode, normal versus laconic, for ChatGPT, Claude, and Gemini.</h2>
<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; font-size: 12px; color: var(--text-secondary);">
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #2a78d6;"></span>Normal mode</span>
  <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #eb6834;"></span>Laconic mode</span>
</div>
<div style="position: relative; width: 100%; height: 300px;">
  <canvas id="tallyChart3" role="img" aria-label="Bar chart of total words across nine responses per mode. ChatGPT: normal 2171, laconic 376. Claude: normal 4668, laconic 1768. Gemini: normal 3974, laconic 539.">ChatGPT normal 2171, laconic 376. Claude normal 4668, laconic 1768. Gemini normal 3974, laconic 539.</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const mu5 = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#898781';
const dk5 = matchMedia('(prefers-color-scheme: dark)').matches;
new Chart(document.getElementById('tallyChart3'), {
  type: 'bar',
  data: {
    labels: ['ChatGPT', 'Claude', 'Gemini'],
    datasets: [
      { label: 'Normal', data: [2171, 4668, 3974], backgroundColor: '#2a78d6', borderRadius: { topLeft: 4, topRight: 4 }, maxBarThickness: 24 },
      { label: 'Laconic', data: [376, 1768, 539], backgroundColor: '#eb6834', borderRadius: { topLeft: 4, topRight: 4 }, maxBarThickness: 24 }
    ]
  },
  options: {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: (c) => c.dataset.label + ': ' + c.parsed.y.toLocaleString() + ' words' } }
    },
    scales: {
      y: { beginAtZero: true, title: { display: true, text: 'Total words (9 responses)', color: mu5, font: { size: 12 } }, ticks: { color: mu5, callback: (v) => v.toLocaleString() }, grid: { color: dk5 ? '#2c2c2a' : '#e1e0d9' } },
      x: { ticks: { color: mu5 }, grid: { display: false } }
    }
  }
});
</script>
